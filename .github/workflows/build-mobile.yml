name: Build Mobile Clients

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug --no-daemon
          APK_PATH=$(find composeApp/build/outputs/apk -name "*.apk" -type f | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Iskra-Android-${GITHUB_REF_NAME}.apk"

      - name: Publish Android Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: Iskra-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Framework
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Link iOS Framework
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon
          zip -r "Iskra-iOS-Framework-${GITHUB_REF_NAME}.zip" composeApp/build/bin/iosArm64/releaseFramework

      - name: Publish iOS Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: Iskra-iOS-Framework-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
