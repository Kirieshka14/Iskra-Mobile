name: Build Mobile Clients (Kotlin Multiplatform)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (KMP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug --no-daemon
          APK_PATH=$(find composeApp/build/outputs/apk -name "*.apk" -type f | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Iskra-Android-v0.8.0.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: Iskra-Android-v0.8.0.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Framework (KMP)
    runs-on: macos-14
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Link iOS Framework
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon

  publish-release:
    name: Publish Mobile Release Assets
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && !cancelled() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            release-assets/*.apk
            release-assets/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
