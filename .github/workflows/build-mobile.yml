name: Build Mobile Clients (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Iskra-Android-v0.7.1.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: Iskra-Android-v0.7.1.apk
          if-no-files-found: error

  build-ios:
    name: 🍎 Build iOS IPA (macOS Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync ios

      - name: Build iOS Application (Xcode)
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

          mkdir -p build-output/Payload
          cp -r build/Release-iphoneos/App.app build-output/Payload/
          cd build-output
          zip -r ../../../Iskra-iOS-v0.7.1.ipa Payload/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: Iskra-iOS-v0.7.1.ipa
          if-no-files-found: warn

  publish-release:
    name: 🚀 Publish Mobile Release Assets (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.apk
            release-assets/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
