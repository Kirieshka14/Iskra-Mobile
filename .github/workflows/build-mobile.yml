name: Build Mobile Clients (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4
        with:
          path: mobile

      - name: Checkout IskraAi Frontend
        uses: actions/checkout@v4
        with:
          repository: Kirieshka14/IskraAi
          path: frontend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Frontend Web Bundle
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          mkdir -p ../mobile/out
          cp -r out/* ../mobile/out/

      - name: Install Mobile Dependencies & Sync Capacitor
        run: |
          cd mobile
          npm install
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Iskra-Android-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: 🍎 Build iOS IPA (macOS Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Iskra-Mobile
        uses: actions/checkout@v4
        with:
          path: mobile

      - name: Checkout IskraAi Frontend
        uses: actions/checkout@v4
        with:
          repository: Kirieshka14/IskraAi
          path: frontend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Web Bundle
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          mkdir -p ../mobile/out
          cp -r out/* ../mobile/out/

      - name: Install Mobile Dependencies & Sync Capacitor
        run: |
          cd mobile
          npm install
          npx cap sync ios

      - name: Build iOS Application (Xcode)
        run: |
          cd mobile/ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

          mkdir -p build-output/Payload
          cp -r build/Release-iphoneos/App.app build-output/Payload/
          cd build-output
          zip -r ../Iskra.ipa Payload/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Iskra-iOS-Package
          path: mobile/ios/App/Iskra.ipa
          if-no-files-found: warn
